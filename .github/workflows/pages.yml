# Builds the sagitt·AI·re site (MkDocs Material, English, French, German and Spanish) from sagittaire/ and publishes it
# with GitHub Pages. The app was called Ullr before: every old /ullr/ address gets a page that redirects to its new one.
# The sources are pushed here from the private project by its tools/site.py. No secrets are used.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install -r sagittaire/requirements.txt
          mkdocs build --strict -f sagittaire/mkdocs.yml -d "$PWD/_site/sagittaire"
          cp index.html _site/
      - name: Redirect the old /ullr/ addresses
        run: |
          python3 - <<'EOF'
          import html, os
          base = "https://ashencroft-hyperautomation.github.io/sagittaire/"
          for folder, _, files in os.walk("_site/sagittaire"):
              if "index.html" not in files:
                  continue
              rel = os.path.relpath(folder, "_site/sagittaire")
              rel = "" if rel == "." else rel + "/"
              url = html.escape(base + rel)
              os.makedirs(os.path.join("_site/ullr", rel), exist_ok=True)
              with open(os.path.join("_site/ullr", rel, "index.html"), "w", encoding="utf-8") as f:
                  f.write(f'<!doctype html><html><head><meta charset="utf-8"><title>sagitt·AI·re</title>'
                          f'<meta http-equiv="refresh" content="0; url={url}"><link rel="canonical" href="{url}"></head>'
                          f'<body><p>Ullr is now <a href="{url}">sagitt·AI·re</a>.</p></body></html>')
          EOF
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
