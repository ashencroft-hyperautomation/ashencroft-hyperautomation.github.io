# Public website for end users (English, French, German and Spanish), in Archery Canada's colours. Built by tools/site.py; no security or developer pages here.
site_name: sagitt·AI·re
site_description: Archery records with AI or manual scoring, for Android. Photograph the target, check the arrows the AI is unsure about or place them yourself, keep your history on your phone.
site_url: https://ashencroft-hyperautomation.github.io/sagittaire/
copyright: sagitt·AI·re, Archery Canada’s app · Created pro bono by <strong>Ashencroft Studio</strong> — Responsible AI &amp; Hyperautomation Experts

theme:
  name: material
  language: en
  logo: images/icons/6-target-leaf.png
  favicon: images/icons/6-target-leaf.png
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - toc.follow
    - content.tooltips

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: sagitt·AI·re
          site_description: Le carnet de tir à l'arc avec comptage par IA, pour Android. Photographiez la cible, vérifiez les flèches dont l'IA doute, gardez votre historique sur votre téléphone.
          copyright: sagitt·AI·re, l’application de Tir à l’arc Canada · Créée pro bono par le <strong>Studio Ashencroft</strong> — Experts en IA &amp; Hyper Automatisation Responsable
