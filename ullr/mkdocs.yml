# Public website for end users (English and French). Built by tools/site.py; no security or developer pages here.
site_name: Ullr
site_description: Archery records with AI or manual scoring, for Android. Photograph the target, check the arrows the AI is unsure about or place them yourself, keep your history on your phone.
site_url: https://ashencroft-hyperautomation.github.io/ullr/
copyright: Ullr — a personal archery project

theme:
  name: material
  language: en
  logo: images/icons/3-carved-target.png
  favicon: images/icons/3-carved-target.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - toc.follow
    - content.tooltips

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: Ullr
          site_description: Le carnet de tir à l'arc avec comptage par IA, pour Android. Photographiez la cible, vérifiez les flèches dont l'IA doute, gardez votre historique sur votre téléphone.
          nav_translations:
            Home: Accueil
            Getting started: Pour commencer
            Modes: Modes
            Normal mode: Mode normal
            Game mode: Mode jeu
            Scoring: Comptage
            Three ways to score: Trois façons de compter
            Your own API key: Votre propre clé API
            Share with your AI app: Partager avec votre application d'IA
            Manual scoring: Comptage manuel
            Features: Fonctions
            Sessions: Séances
            Checking arrows: Vérifier les flèches
            Scoring rules: Règles de comptage
            Bows: Arcs
            History: Historique
            Statistics: Statistiques
            Storage and backup: Stockage et sauvegarde
            Look and language: Apparence et langue
            About: À propos
            Screenshots: Captures d'écran
            How it works: Fonctionnement
            Privacy: Confidentialité
            Security: Sécurité
            App icon: L'icône
            Roadmap: Feuille de route
            Terms of use: Conditions d'utilisation
            Privacy policy: Politique de confidentialité
            Open-source licences: Licences de logiciels libres

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started: guide.md
  - Modes:
      - Normal mode: normal.md
      - Game mode: game.md
  - Scoring:
      - Three ways to score: scoring.md
      - Your own API key: scoring-api.md
      - Share with your AI app: scoring-share.md
      - Manual scoring: scoring-manual.md
  - Features:
      - Sessions: sessions.md
      - Checking arrows: review.md
      - Scoring rules: rules.md
      - Bows: bows.md
      - History: history.md
      - Statistics: stats.md
      - Storage and backup: backup.md
      - Look and language: look.md
  - About:
      - Screenshots: screenshots.md
      - How it works: how-it-works.md
      - Privacy: privacy.md
      - Security: security.md
      - App icon: icon.md
      - Roadmap: roadmap.md
      - Terms of use: terms.md
      - Privacy policy: privacy-policy.md
      - Open-source licences: licences.md
